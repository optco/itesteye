<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optometry Tariff Codes</title>
<style>
:root{--bg1:#e9f7ee;--bg2:#d4eef0;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--text:#16302a;--muted:#4c6b62;--green:#13a538;--deep:#006633;--teal:#00a99d;--chip:rgba(19,165,56,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a1f17;--bg2:#08262b;--glass:rgba(20,50,40,.55);--edge:rgba(255,255,255,.12);--text:#e6f4ee;--muted:#9ab8ad;--chip:rgba(19,165,56,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0a1f17;--bg2:#08262b;--glass:rgba(20,50,40,.55);--edge:rgba(255,255,255,.12);--text:#e6f4ee;--muted:#9ab8ad;--chip:rgba(19,165,56,.22);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg1);background-image:radial-gradient(circle at 15% 0,var(--green) 0,transparent 35%),radial-gradient(circle at 90% 30%,var(--teal) 0,transparent 30%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:20px}
.tag{display:inline-block;background:var(--green);color:#fff;font-weight:700;letter-spacing:.12em;font-size:12px;padding:5px 14px;border-radius:99px}
h1{margin:12px 0 4px;font-size:clamp(26px,6vw,38px);letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-radius:20px;box-shadow:0 8px 30px rgba(0,60,30,.12)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;padding:10px;margin-bottom:16px}
input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--chip)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 2px}
.chips button{flex:none;border:0;cursor:pointer;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:99px;background:var(--chip);color:var(--text)}
.chips button.on{background:var(--green);color:#fff}
section{margin-bottom:16px;overflow:hidden}
h2{margin:0;padding:14px 18px;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--deep),var(--green));display:flex;justify-content:space-between;gap:8px}
h2 small{opacity:.85;font-weight:500}
.row{display:flex;gap:14px;align-items:baseline;padding:11px 18px;border-top:1px solid var(--edge);cursor:pointer;font-size:14.5px}
.row:hover{background:var(--chip)}
.code{flex:none;width:54px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.row.copied .code::after{content:" ✓"}
.empty{text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px}
</style>
</head>
<body>
<main>
  <a class="tag" href="index.html"><span aria-hidden="true">←</span> Back to all resources</a>
<header>
<span class="tag">OPTOMETRY</span>
<h1>Optometry Tariff Codes</h1>
<p>Tariffs with effect from 1 January 2020 · <span id="total"></span> codes</p>
</header>
<div class="glass bar">
<input id="q" type="search" placeholder="Search by code or description…" autocomplete="off">
<div class="chips" id="chips"></div>
</div>
<div id="list"></div>
<footer>Tap a row to copy its code.</footer>
</main>
<script>
const D=[
["Examinations & Consultations",`11001|Optometric Examination
11021|Optometric Re-Examination within six months of 11001/11081
11041|Consultation (15 minutes) without performing an Optometric Examination
11081|Optometric Examination and Visual Field Screening
11141|Refractive Status Evaluation
11161|Ocular Pathology Examination
11171|Ocular Pathology Examination Follow up`],
["Diagnostic Tests & Imaging",`11183|Keratometry
11202|Tonometry (Non-contact)
11212|Tonometry (Aplanation)
11221|Colour Vision Screening
11246|Colour Vision Evaluation
11265|Contrast Sensitivity Evaluation
11283|Lacrimal System Evaluation
11303|Cycloplegic Refraction
11323|Preferential Looking (Infants < Two Years)
11346|Corneal Topography
11356|Gonioscopy
11366|Dilated Fundus Examination / BIO
11402|Visual Field - Screening
11423|Visual Field - Evaluation
11443|Visual Field - Threshold Testing
11604|Photography of Anterior Segment
11624|Photography of Fundus
11644|Diagnostic and Photographic Materials
11702|Pachymetry
11802|Optical Coherence Tomography (OCT)
11902|Visual Evoked Potentials (VEP) - Unilateral
11904|Visual Evoked Potentials (VEP) - Bilateral`],
["Dispensing",`11501|Dispensing Fee - Single Vision
11521|Dispensing Fee - Bifocals
11541|Dispensing Fee - Varifocals`],
["Visits & Screening",`11707|After Hours or Away from Practice Visit
11729|Broken Appointments
11809|Screening School (per hour)
11829|Screening Industrial (per hour)`],
["Contact Lenses",`12012|C Lens Consultation Basic - per 30 minutes
12032|C Lens Consultation Complex - per 30 minutes
12052|C Lens Consultation Advanced - per 30 minutes
12062|C Lens Consultation - Therapeutic - per 30 minutes
12072|C Lens Dispensing and/or Assessment
12112|C Lens follow-up Examination/Basic Case - per 30 minutes
12132|C Lens follow-up Examination/Complex Case - per 30 minutes
12152|C Lens follow-up Examination/Advanced Case - per 30 minutes
12162|C Lens Follow-up Therapeutic - per 30 minutes
12503|C Lens Related Problems Assessment - Monocular
12523|C Lens Related Problems Assessment - Binocular
12533|C Lens Instruction`],
["Binocular Vision & Vision Training",`13003|Binocular Instability Evaluation - Simple Case
13023|Binocular Instability Evaluation - Complex Case
13105|Visually Related Learning Disorders Evaluation
13125|Eye Movements Evaluation (E.G. Visigraph)
13403|Vision Training - Home Therapy Instruction
13423|Vision Training - Individual (per 15 minutes)
13445|Vision Training - Individual (per 30 minutes)
13463|Vision Training - Group per Patient (per 15 minutes)
13489|Vision Training - Away From Practice (add to 13423 or 13463)
13509|Reading Rate - screening
13529|Reading Ortho-Didactical skills evaluation
13549|Colorimetry Intuitive - evaluation`],
["Sports Vision",`14008|Sports Vision Individual Screening
14218|Sports Vision Individual Evaluation
14238|Sports Vision Individual Training (per 15 minutes)
14268|Sports Vision Group Screening
14278|Sports Vision Group Evaluation
14288|Sports Vision Group Training (per 15 minutes)
14309|Sports Vision Individual Screening
14319|Sports Vision Individual Evaluation
14329|Sports Vision Individual Training (per 15 minutes)
14369|Sports Vision Group Screening
14379|Sports Vision Group Evaluation
14389|Sports Vision Group Training (per 15 minutes)`],
["Minor Procedures",`15000|Removal of Foreign Body External Eye Conjunctiva
15002|Removal of Foreign Body Embedded Conjunctival/Scleral Nonperforating
15004|Removal of Foreign Body Corneal with Slit Lamp
15006|Conjunctiva – Incision and Drainage
15008|Incision of Conjunctiva; Drainage of Cyst
15010|Expression Conjunctival Follicles/Trachoma
15012|Lacrimal System - Repair
15014|Closure of Lacrimal Punctum by Plug`],
["Low Vision",`16013|Low Vision Assessment per 30 mins
16023|Low Vision Rehabilitation per 30 mins
16073|Low Vision Training per 30 mins`],
["Reports & Products",`19001|Report at request of Medical Aid.
19021|Report at Patient’s request (arising from Series 11001)
23801|OTC Eyedrops
23907|Contact Lens Solutions
23919|Contact Lens Accessories
24022|Hard Contact Lens
24024|Rigid Scleral Contact lens`]
].map(([t,s])=>({t,r:s.split("\n").map(l=>l.split("|"))}));
const $=id=>document.getElementById(id);
let cat="All";
$("total").textContent=D.reduce((n,s)=>n+s.r.length,0);
function chips(){
  $("chips").innerHTML=["All",...D.map(s=>s.t)].map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
}
function render(){
  const q=$("q").value.trim().toLowerCase();let out="";
  D.forEach(s=>{
    if(cat!=="All"&&cat!==s.t)return;
    const rows=s.r.filter(([c,d])=>!q||c.includes(q)||d.toLowerCase().includes(q));
    if(!rows.length)return;
    out+=`<section class="glass"><h2>${s.t.replace(/&/g,"&amp;")}<small>${rows.length}</small></h2>`+
      rows.map(([c,d])=>`<div class="row" data-code="${c}"><span class="code">${c}</span><span>${d.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span></div>`).join("")+`</section>`;
  });
  $("list").innerHTML=out||`<div class="glass empty">No matching codes.</div>`;
}
$("q").addEventListener("input",render);
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;chips();render();});
$("list").addEventListener("click",e=>{
  const r=e.target.closest(".row");if(!r)return;
  try{navigator.clipboard.writeText(r.dataset.code)}catch(_){}
  r.classList.add("copied");setTimeout(()=>r.classList.remove("copied"),1200);
});
chips();render();
</script>
</body>
</html>
