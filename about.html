<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Akhtar | iTestEye</title>
    <meta name="description" content="Links and contact for MT Akhtar (itesteye)">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
<link rel="stylesheet" href="bg.css">
    <style>
        
        :root {
    /* Slightly off-white background so the glass effect is visible */
    --bg-color: #f4f4f5; 
    
    /* Frosted white background for the cards */
    --glass-bg: rgba(255, 255, 255, 0.6); 
    
    /* Subtle dark border to define the edge against white */
    --glass-border: rgba(0, 0, 0, 0.08); 
    
    /* Deep black/gray for primary text (excellent contrast) */
    --text-primary: #18181b; 
    
    /* Medium gray for secondary text (passes accessibility) */
    --text-secondary: #52525b; 
    
    /* Subtle dark hover effect */
    --accent-hover: rgba(0, 0, 0, 0.04); 
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
          
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        .liquid-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 15s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .handle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            padding: 1rem;
        }

        .social-card:hover {
            background: var(--accent-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }

        .social-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 0.75rem;
            fill: currentColor;
        }

        .platform-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .platform-handle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .contact-btn {
            width: 100%;
            padding: 1rem;
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .contact-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

     /* Modal Overlay */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); 
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

/* Modal Container */
.modal-glass {
    background: #ffffff; 
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 440px;
    position: relative;
    transform: translateY(10px);
    transition: transform 0.2s ease;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
}

.modal-overlay.active .modal-glass {
    transform: translateY(0);
}

.modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: #52525b; 
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.25rem;
}

.modal-close:hover {
    color: #18181b;
}

.modal-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: #18181b;
}

.modal-desc {
    color: #52525b;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
}

/* Form Elements */
.form-group {
    margin-bottom: 1rem;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 0.85rem;
    color: #52525b;
    margin-bottom: 0.5rem;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    background: #f4f4f5; 
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    color: #18181b; 
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    transition: border-color 0.2s ease;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #18181b;
    background: #ffffff;
}

.submit-btn {
    width: 100%;
    padding: 0.875rem;
    background: #18181b; 
    color: #ffffff; 
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    margin-top: 0.5rem;
    transition: opacity 0.2s ease;
}

.submit-btn:hover {
    opacity: 0.9;
}

.submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
        footer {
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

        <div class="profile-img">
            <span>MT</span>
        </div>
        
        <h1>MT Akhtar</h1>
        <p class="handle">@itesteye</p>
        
        <div class="social-grid">
            <a href="https://instagram.com/itesteye" target="_blank" rel="noopener noreferrer" class="social-card">

                </svg>

                <span class="platform-handle">@itesteye</span>
            </a>

            <a href="https://tiktok.com/@itesteye" target="_blank" rel="noopener noreferrer" class="social-card">
                <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            <a href="https://youtube.com/@itesteye" target="_blank" rel="noopener noreferrer" class="social-card">
                <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

                <span class="platform-handle">@itesteye</span>
            </a>
        </div>

        <button class="contact-btn" id="openContact">Contact Me</button>

        <footer>
            &copy; 2026 iTestEye.com All rights reserved.
        </footer>
    </main>

    <div class="modal-overlay" id="contactModal" hidden>
        <div class="modal-glass">
            <button class="modal-close" id="closeContact" aria-label="Close">&times;</button>
            <h2 class="modal-title">Get in touch</h2>
            <p class="modal-desc">Send a message to @itesteye</p>
            
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
                <input type="hidden" name="access_key" value="65bb33ff-0316-4d93-9879-f4e3d82dfc52">
                <input type="hidden" name="subject" value="New message via MT Akhtar Link Page">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required rows="4" placeholder="Your message..."></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('contactModal');
        const openBtn = document.getElementById('openContact');
        const closeBtn = document.getElementById('closeContact');

        function openModal() {
            modal.hidden = false;
            document.body.style.overflow = 'hidden';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                modal.hidden = true;
                document.body.style.overflow = '';
            }, 200);
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.hidden) closeModal();
        });

        const contactForm = document.querySelector('.contact-form');
        contactForm.addEventListener('submit', async (e) => {
            const btn = contactForm.querySelector('.submit-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Sending...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.textContent = 'Sent';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                    closeModal();
                    contactForm.reset();
                }, 1500);
            }, 800);
        });
    </script>
    <script src="/load.js"></script>
</body>
</html>
